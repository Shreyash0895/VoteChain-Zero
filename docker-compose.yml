version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: votechain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: votechain_zero
      POSTGRES_USER: votechain_user
      POSTGRES_PASSWORD: votechain_pass
    ports:
      - "5432:5432"
    volumes:
      - votechain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votechain_user -d votechain_zero"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: votechain-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@votechain.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  votechain_pgdata:
