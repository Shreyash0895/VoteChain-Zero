spring:
  application:
    name: votechain-zero

  datasource:
    url: jdbc:postgresql://localhost:5432/votechain_zero
    username: votechain_user
    password: votechain_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

votechain:
  jwt:
    secret: CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_IN_PRODUCTION_ENV
    expiration-ms: 3600000
  blockchain:
    mining-difficulty: 4
    votes-per-block: 5
  otp:
    expiry-minutes: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false   # placeholder credentials fail this check and drag the whole /actuator/health to DOWN — re-enable once real SMTP creds are set

springdoc:
  swagger-ui:
    path: /swagger-ui.html