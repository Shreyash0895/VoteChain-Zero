spring:
  application:
    name: votechain-zero

  datasource:
    url: jdbc:postgresql://localhost:5432/votechain_zero
    username: votechain_user
    password: votechain_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

votechain:
  jwt:
    secret: CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_IN_PRODUCTION_ENV
    expiration-ms: 3600000
  blockchain:
    mining-difficulty: 4
    votes-per-block: 5
    integrity-check-interval-ms: 60000
  otp:
    expiry-minutes: 5
  admin:
    # Seeded once on startup by AdminSeeder — see .env for the real values.
    # Defaults below are placeholders only, meant to be overridden.
    email: ${ADMIN_EMAIL:admin@votechain.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html